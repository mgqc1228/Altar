<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Altar de Muertos Interactivo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { background: #0a0608; color: #f5e6c8; font-family: 'Playfair Display', serif; min-height: 100vh; overflow-x: hidden; position: relative; }
    .bg-overlay {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 20%, rgba(120, 40, 20, 0.25) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(80, 20, 60, 0.2) 0%, transparent 50%),
        linear-gradient(180deg, #0a0608 0%, #1a0c12 40%, #0f080a 100%);
    }
    .particle { position: fixed; width: 3px; height: 3px; background: #e67e22; border-radius: 50%; opacity: 0.3; pointer-events: none; z-index: 1; animation: float 12s infinite ease-in-out; }
    @keyframes float { 0%, 100% { transform: translate(0, 0); opacity: 0.2; } 50% { transform: translate(15px, -40px); opacity: 0.5; } }

    header { position: relative; z-index: 10; text-align: center; padding: 2.5rem 1rem 1.5rem; }
    header h1 { font-family: 'Cinzel', serif; font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 700; letter-spacing: 4px; color: #f0c14b; margin-bottom: 0.4rem; text-shadow: 0 0 20px rgba(240, 193, 75, 0.4), 0 2px 4px rgba(0,0,0,0.8); }
    header p { font-size: 1rem; color: #d4a574; font-style: italic; opacity: 0.9; }

    .altar-container { position: relative; z-index: 5; max-width: 700px; margin: 0 auto 4rem; padding: 0 1rem; }
    .altar-base { position: relative; width: 100%; max-width: 640px; margin: 0 auto; border-radius: 12px; overflow: hidden; box-shadow: 0 0 60px rgba(230, 126, 34, 0.15), 0 20px 40px rgba(0,0,0,0.6); }
    .altar-base img.main-altar { width: 100%; display: block; }

    /* Elementos sobre el altar.
       Importante: el botón NO lleva transform/filter/z-index, para que el "multiply"
       de la imagen se mezcle con la tela del altar y el blanco del JPG desaparezca. */
    .altar-item { position: absolute; background: none; border: none; cursor: pointer; padding: 0; display: block; }
    .altar-item img {
      width: 100%; aspect-ratio: 1; object-fit: contain; display: block;
      mix-blend-mode: multiply;
      transform-origin: 50% 100%; transition: transform 0.3s ease;
    }
    .altar-item:hover img, .altar-item:focus-visible img { transform: scale(1.2); }
    .altar-item:focus-visible { outline: 2px solid #f0c14b; outline-offset: 2px; border-radius: 8px; }
    .altar-item::after {
      content: ''; position: absolute; inset: -2px; border-radius: 12%;
      border: 2px solid rgba(240, 193, 75, 0.85); pointer-events: none;
      animation: pulse 2.6s ease-out 3; opacity: 0; /* pulsa 3 veces y se calla */
    }
    @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.7; } 70%, 100% { transform: scale(1.3); opacity: 0; } }
    .altar-item .tip {
      position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%);
      background: rgba(10, 6, 8, 0.92); color: #f0c14b; border: 1px solid rgba(240,193,75,0.5);
      font-family: 'Cinzel', serif; font-size: 0.7rem; white-space: nowrap; padding: 3px 8px;
      border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 3;
    }
    .altar-item:hover .tip, .altar-item:focus-visible .tip { opacity: 1; }
    .debug-line { position: absolute; left: 0; right: 0; border-top: 1px dashed #0f0; color: #0f0; font-size: 11px; pointer-events: none; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(5, 2, 4, 0.88); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.4s ease; backdrop-filter: blur(8px); }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal { background: linear-gradient(160deg, #1c1014 0%, #120a0d 100%); border: 1px solid rgba(240, 193, 75, 0.35); border-radius: 18px; max-width: 560px; width: 92%; max-height: 90vh; overflow-y: auto; padding: 2rem; position: relative; transform: scale(0.85) translateY(30px); transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 40px rgba(230, 126, 34, 0.12); }
    .modal-overlay.active .modal { transform: scale(1) translateY(0); }
    .modal-close { position: absolute; top: 1rem; right: 1.2rem; background: transparent; border: none; color: #f0c14b; font-size: 1.8rem; cursor: pointer; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: all 0.25s ease; z-index: 10; }
    .modal-close:hover { background: rgba(240, 193, 75, 0.15); transform: rotate(90deg); }
    /* Fondo crema + multiply: el blanco del JPG se funde con la tarjeta */
    .modal-image-wrap { text-align: center; margin-bottom: 1.5rem; padding: 1rem; border-radius: 16px; isolation: isolate; background: radial-gradient(circle at 50% 40%, #fffaf0 0%, #eadcc0 100%); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .modal-image-wrap img { max-width: 100%; max-height: 240px; object-fit: contain; mix-blend-mode: multiply; }
    .modal-level { font-family: 'Cinzel', serif; font-size: 0.8rem; color: #e67e22; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.4rem; text-align: center; }
    .modal h2 { font-family: 'Cinzel', serif; font-size: 1.7rem; color: #f0c14b; margin-bottom: 1rem; text-align: center; }
    .modal p { font-size: 1.05rem; line-height: 1.7; color: #e8d5b5; text-align: center; }

    /* Pétalos que cubren la pantalla */
    .petals-container { position: fixed; inset: 0; z-index: 2000; overflow: hidden; display: none; }
    .petals-container.active { display: block; } /* bloquea clics mientras dura */
    .veil { position: absolute; inset: 0; opacity: 0; background: radial-gradient(circle at 50% 50%, rgba(230,126,34,0.55), rgba(90,25,5,0.85)); animation: veil 3.6s ease-in-out forwards; }
    @keyframes veil { 0% { opacity: 0; } 32% { opacity: 1; } 60% { opacity: 1; } 100% { opacity: 0; } }
    .petal { position: absolute; opacity: 0; width: var(--sz); height: var(--h); animation: sweep 3.4s ease-in-out forwards; will-change: transform, opacity; }
    .petal.photo { background: var(--petal) center / contain no-repeat; }
    .petal.css { /* plan B si el navegador no deja leer la imagen */
      border-radius: 50% 0 50% 50% / 60% 0 60% 60%;
      background: radial-gradient(ellipse at 30% 25%, #ffd36b 0%, var(--c) 55%, #a63d00 100%);
      box-shadow: inset -3px -4px 8px rgba(120, 40, 0, 0.35);
    }
    @keyframes sweep {
      0%   { opacity: 0; transform: translate(var(--dx), -45vh) rotate(0deg) scale(0.4); }
      30%  { opacity: 1; transform: translate(0, 0) rotate(var(--r1)) scale(1); }
      62%  { opacity: 1; transform: translate(var(--sway), 2vh) rotate(var(--r2)) scale(1.05); }
      100% { opacity: 0.9; transform: translate(var(--sway2), 140vh) rotate(var(--r3)) scale(0.9); }
    }

    footer { text-align: center; padding: 2rem 1rem 3rem; color: #8a6a4a; font-size: 0.85rem; position: relative; z-index: 5; }
    @media (max-width: 600px) { .modal { padding: 1.5rem 1.2rem; } }
    @media (prefers-reduced-motion: reduce) { .altar-item::after, .particle { animation: none; } }
  </style>
</head>
<body>
  <div class="bg-overlay"></div>
  <div id="particles"></div>

  <header>
    <h1>Altar de Muertos</h1>
    <p>Ofrenda interactiva • Haz clic en cada elemento</p>
  </header>

  <main class="altar-container">
    <div class="altar-base" id="altar"></div>
  </main>

  <footer>Que las almas encuentren el camino iluminado por la luz de las velas</footer>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Cerrar">×</button>
      <div class="modal-image-wrap"><img id="modalImg" src="" alt="" /></div>
      <div class="modal-level" id="modalLevel"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalDesc"></p>
    </div>
  </div>

  <div class="petals-container" id="petalsContainer"></div>

  <script>
    /* ================= CONFIGURACIÓN (lo único que normalmente tocas) =================
       IMG_DIR: carpeta donde están las imágenes, con "/" al final. Si están junto al
       index.html, déjalo vacío: "". Los nombres son sensibles a mayúsculas en GitHub. */
    const IMG_DIR = "img/";
    const ALTAR_IMG = "altar.jpg";
    const PETAL_IMG = "petalo.jpg";

    /* Posición de cada nivel sobre la imagen (en % del altar)
       y: altura del borde frontal del escalón, donde se apoyan los elementos
       x: [inicio, fin] del ancho disponible    w: tamaño del elemento (% del ancho)
       Abre la página con ?debug al final de la URL para ver las líneas guía. */
    const LEVELS = {
      1: { y: 19, x: [35, 65], w: 9 },
      2: { y: 29, x: [30, 70], w: 9.5 },
      3: { y: 40, x: [24, 76], w: 9 },
      4: { y: 52, x: [18, 82], w: 10 },
      5: { y: 64, x: [13, 87], w: 10 },
      6: { y: 76, x: [9, 91], w: 11 },
      7: { y: 92, x: [5, 95], w: 12 }
    };

    const elements = [
      { lvl: 1, name: "Crucifijo", img: "crucifijo.jpg", level: "Primer nivel — El cielo y la fe",
        desc: "Simboliza la fe cristiana y la esperanza en la vida después de la muerte. Representa la protección espiritual y el vínculo con lo divino." },
      { lvl: 1, name: "Arco de flores", img: "arco.jpg", level: "Primer nivel — El cielo y la fe",
        desc: "Representa simbólicamente la entrada al mundo de los difuntos. Generalmente se coloca en la parte superior del altar como portal entre ambos mundos." },
      { lvl: 2, name: "Fotografía", img: "selena.jpg", level: "Segundo nivel — Las ánimas",
        desc: "Identifica a quién está dedicada la ofrenda y permite recordar su vida. Es el elemento más personal y el corazón del altar." },
      { lvl: 3, name: "Sal", img: "sal.jpg", level: "Tercer nivel — La purificación",
        desc: "Simboliza la purificación y, según la tradición, ayuda a proteger el alma durante su recorrido entre los mundos." },
      { lvl: 3, name: "Agua", img: "agua.jpg", level: "Tercer nivel — La purificación",
        desc: "Representa la vida y se ofrece para calmar la sed de las almas después de su largo viaje desde el más allá." },
      { lvl: 3, name: "Copal", img: "copal.jpg", level: "Tercer nivel — La purificación",
        desc: "Su humo aromático se utiliza desde tiempos prehispánicos para purificar el ambiente y recibir dignamente a los difuntos." },
      { lvl: 3, name: "Incienso", img: "incienso.jpg", level: "Tercer nivel — La purificación",
        desc: "Complementa al copal. Su fragancia eleva las oraciones y limpia el espacio de malas energías para la llegada de las almas." },
      { lvl: 4, name: "Pan de muerto", img: "pan.jpg", level: "Cuarto nivel — El alimento tradicional",
        desc: "Alimento tradicional que simboliza la fraternidad y el recuerdo de los difuntos. Su forma evoca los huesos y el ciclo de la vida." },
      { lvl: 4, name: "Calavera", img: "calavera.jpg", level: "Cuarto nivel — El alimento tradicional",
        desc: "Representa la muerte como parte natural de la vida. Las calaveritas de azúcar o chocolate son características de esta celebración." },
      { lvl: 4, name: "Dulces", img: "dulces.jpg", level: "Cuarto nivel — El alimento tradicional",
        desc: "Se ofrecen como muestra de cariño y hospitalidad hacia las almas. Endulzan el regreso de quienes ya partieron." },
      /* Nivel 5 (comida y bebidas) libre: agrega tamales, mole, atole, etc. con lvl: 5 */
      { lvl: 6, name: "Frutas", img: "frutas.jpg", level: "Sexto nivel — La naturaleza y los aromas",
        desc: "Representan la generosidad de la naturaleza y se ofrecen como alimento fresco. Colores, aromas y sabores de la temporada." },
      { lvl: 6, name: "Flor de cempasúchil", img: "flor.jpg", level: "Sexto nivel — La naturaleza y los aromas",
        desc: "Su color naranja intenso y su aroma se relacionan con la guía de las almas hacia la ofrenda. Es la flor sagrada del Día de Muertos." },
      { lvl: 7, name: "Veladora", img: "vela.gif", level: "Séptimo nivel — La tierra y el descanso",
        desc: "Representa la luz y la esperanza. Según la tradición, su llama ayuda a guiar a las almas en su camino de regreso al hogar." }
    ];

    /* ---------- Construir el altar ---------- */
    const altar = document.getElementById('altar');
    const base = new Image();
    base.className = 'main-altar'; base.alt = 'Altar de Muertos de siete niveles';
    base.src = IMG_DIR + ALTAR_IMG;
    altar.appendChild(base);

    Object.keys(LEVELS).forEach(n => {
      const items = elements.filter(e => e.lvl == n);
      const { y, x, w } = LEVELS[n];
      const step = (x[1] - x[0]) / Math.max(items.length, 1);
      items.forEach((el, i) => {
        const cx = x[0] + step * (i + 0.5);
        const b = document.createElement('button');
        b.className = 'altar-item';
        b.style.left = (cx - w / 2) + '%';   /* sin transform, para no romper el multiply */
        b.style.bottom = (100 - y) + '%';
        b.style.width = w + '%';
        b.setAttribute('aria-label', el.name);
        b.innerHTML = `<img src="${IMG_DIR + el.img}" alt="" /><span class="tip">${el.name}</span>`;
        b.addEventListener('click', () => openModal(el));
        altar.appendChild(b);
      });
    });

    if (location.search.includes('debug')) {
      Object.entries(LEVELS).forEach(([n, l]) => {
        const d = document.createElement('div');
        d.className = 'debug-line'; d.style.top = l.y + '%'; d.textContent = 'Nivel ' + n;
        altar.appendChild(d);
      });
    }

    /* ---------- Partículas de fondo ---------- */
    const pc = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.top = Math.random() * 100 + 'vh';
      p.style.animationDelay = Math.random() * 10 + 's';
      p.style.animationDuration = (8 + Math.random() * 10) + 's';
      pc.appendChild(p);
    }

    /* ---------- Modal ---------- */
    const overlay = document.getElementById('modalOverlay');
    const modalImg = document.getElementById('modalImg');
    let busy = false;

    function openModal(el) {
      if (busy) return;
      petalStorm(() => {
        modalImg.src = IMG_DIR + el.img;
        modalImg.alt = el.name;
        document.getElementById('modalLevel').textContent = el.level;
        document.getElementById('modalTitle').textContent = el.name;
        document.getElementById('modalDesc').textContent = el.desc;
        overlay.classList.add('active');
      });
    }
    function closeModal() {
      if (busy || !overlay.classList.contains('active')) return;
      petalStorm(() => overlay.classList.remove('active'));
    }
    document.getElementById('modalClose').addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    /* ---------- Pétalo: se prepara UNA sola vez ----------
       Quita el fondo blanco de petalo.jpg, lo recorta y lo reduce (máx. 160 px).
       Los cientos de pétalos reutilizan esa misma imagen, así que pesa muy poco.
       Si el navegador bloquea leer la imagen (p. ej. abriendo el archivo con doble clic
       en vez de desde GitHub Pages), usa pétalos dibujados con CSS. */
    let petalURL = null, petalRatio = 0.8;

    (function preparePetal() {
      const im = new Image();
      im.onload = () => {
        try {
          const s = Math.min(1, 160 / Math.max(im.naturalWidth, im.naturalHeight));
          const w = Math.round(im.naturalWidth * s), h = Math.round(im.naturalHeight * s);
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          const ctx = c.getContext('2d'); ctx.drawImage(im, 0, 0, w, h);
          const d = ctx.getImageData(0, 0, w, h), px = d.data;
          let x0 = w, y0 = h, x1 = 0, y1 = 0;
          for (let i = 0; i < px.length; i += 4) {
            const a = Math.max(0, Math.min(1, (255 - px[i + 2] - 20) / 110)); /* azul bajo = pétalo */
            if (a > 0) {
              for (let k = 0; k < 3; k++) px[i + k] = Math.max(0, Math.min(255, (px[i + k] - 255 * (1 - a)) / a)); /* quita el halo blanco */
              if (a > 0.5) { const p = i / 4, x = p % w, y = (p / w) | 0; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
            }
            px[i + 3] = a * 255;
          }
          ctx.putImageData(d, 0, 0);
          const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
          const o = document.createElement('canvas'); o.width = bw; o.height = bh;
          o.getContext('2d').drawImage(c, x0, y0, bw, bh, 0, 0, bw, bh);
          petalURL = o.toDataURL('image/png');
          petalRatio = bw / bh;
        } catch (e) { petalURL = null; }
      };
      im.src = IMG_DIR + PETAL_IMG;
    })();

    /* ---------- Lluvia de pétalos que cubre toda la pantalla ---------- */
    const colors = ['#f39c12', '#e67e22', '#ff9f1c', '#d35400', '#f5b041'];
    const rand = (a, b) => a + Math.random() * (b - a);

    function petalStorm(onCovered) {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { onCovered(); return; }
      busy = true;
      const box = document.getElementById('petalsContainer');
      const vw = innerWidth, vh = innerHeight;
      const size = Math.min(Math.max(Math.min(vw, vh) * 0.15, 40), 100);
      const count = Math.min(260, Math.ceil(1.6 * vw * vh / (size * size * 0.7)));

      box.innerHTML = '<div class="veil"></div>';
      box.classList.add('active');
      if (petalURL) box.style.setProperty('--petal', `url(${petalURL})`);

      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        const sz = size * rand(0.6, 1.4);
        p.className = 'petal ' + (petalURL ? 'photo' : 'css');
        p.style.cssText =
          `left:${rand(-3, 100)}vw;top:${rand(-3, 100)}vh;--sz:${sz}px;--h:${sz / (petalURL ? petalRatio : 0.8)}px;--c:${colors[i % 5]};` +
          `--dx:${rand(-15, 15)}vw;--r1:${rand(-200, 200)}deg;--r2:${rand(-300, 300)}deg;--r3:${rand(-720, 720)}deg;` +
          `--sway:${rand(-6, 6)}vw;--sway2:${rand(-20, 20)}vw;animation-delay:${rand(0, 0.7)}s;`;
        box.appendChild(p);
      }
      setTimeout(onCovered, 1500);
      setTimeout(() => { box.classList.remove('active'); box.innerHTML = ''; busy = false; }, 4300);
    }
  </script>
</body>
</html>
