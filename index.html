<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Altar de Muertos Interactivo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0608;
      color: #f5e6c8;
      font-family: 'Playfair Display', serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .bg-overlay {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 20%, rgba(120, 40, 20, 0.25) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(80, 20, 60, 0.2) 0%, transparent 50%),
        linear-gradient(180deg, #0a0608 0%, #1a0c12 40%, #0f080a 100%);
    }

    .particle {
      position: fixed; width: 3px; height: 3px; background: #e67e22;
      border-radius: 50%; opacity: 0.3; pointer-events: none; z-index: 1;
      animation: float 12s infinite ease-in-out;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0); opacity: 0.2; }
      50% { transform: translate(15px, -40px); opacity: 0.5; }
    }

    header { position: relative; z-index: 10; text-align: center; padding: 2.5rem 1rem 1.5rem; }
    header h1 {
      font-family: 'Cinzel', serif; font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 700;
      letter-spacing: 4px; color: #f0c14b; margin-bottom: 0.4rem;
      text-shadow: 0 0 20px rgba(240, 193, 75, 0.4), 0 2px 4px rgba(0,0,0,0.8);
    }
    header p { font-size: 1rem; color: #d4a574; font-style: italic; opacity: 0.9; }

    .altar-container { position: relative; z-index: 5; max-width: 700px; margin: 0 auto 4rem; padding: 0 1rem; }

    /* El altar es el escenario: los elementos se colocan encima, por nivel */
    .altar-base {
      position: relative; width: 100%; max-width: 640px; margin: 0 auto;
      border-radius: 12px; overflow: hidden;
      box-shadow: 0 0 60px rgba(230, 126, 34, 0.15), 0 20px 40px rgba(0,0,0,0.6);
    }
    .altar-base img.main-altar { width: 100%; display: block; }

    .altar-item {
      position: absolute;
      transform: translate(-50%, -100%);
      background: none; border: none; cursor: pointer;
      padding: 0; display: block;
      transition: transform 0.3s ease, filter 0.3s ease;
      filter: drop-shadow(0 4px 5px rgba(0,0,0,0.55));
    }
    .altar-item img {
      width: 100%; aspect-ratio: 1; object-fit: contain; display: block;
      border-radius: 10%; background: #fff;
    }
    .altar-item::after {
      content: ''; position: absolute; inset: -4px; border-radius: 14%;
      border: 2px solid rgba(240, 193, 75, 0.8);
      animation: pulse 2.6s ease-out infinite; pointer-events: none;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      70%, 100% { transform: scale(1.25); opacity: 0; }
    }
    .altar-item:hover, .altar-item:focus-visible {
      transform: translate(-50%, -100%) scale(1.18);
      filter: drop-shadow(0 6px 10px rgba(230, 126, 34, 0.8));
      z-index: 5; outline: none;
    }
    .altar-item .tip {
      position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%);
      background: rgba(10, 6, 8, 0.92); color: #f0c14b; border: 1px solid rgba(240,193,75,0.5);
      font-family: 'Cinzel', serif; font-size: 0.7rem; white-space: nowrap;
      padding: 3px 8px; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .altar-item:hover .tip, .altar-item:focus-visible .tip { opacity: 1; }

    /* Guías de nivel (solo con ?debug en la URL) */
    .debug-line { position: absolute; left: 0; right: 0; border-top: 1px dashed #0f0; color: #0f0; font-size: 11px; pointer-events: none; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(5, 2, 4, 0.88); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; transition: all 0.4s ease; backdrop-filter: blur(8px);
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal {
      background: linear-gradient(160deg, #1c1014 0%, #120a0d 100%);
      border: 1px solid rgba(240, 193, 75, 0.35); border-radius: 18px;
      max-width: 560px; width: 92%; max-height: 90vh; overflow-y: auto;
      padding: 2rem; position: relative;
      transform: scale(0.85) translateY(30px);
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 40px rgba(230, 126, 34, 0.12);
    }
    .modal-overlay.active .modal { transform: scale(1) translateY(0); }
    .modal-close {
      position: absolute; top: 1rem; right: 1.2rem; background: transparent; border: none;
      color: #f0c14b; font-size: 1.8rem; cursor: pointer; width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center; border-radius: 50%;
      transition: all 0.25s ease; z-index: 10;
    }
    .modal-close:hover { background: rgba(240, 193, 75, 0.15); transform: rotate(90deg); }
    .modal-image-wrap { text-align: center; margin-bottom: 1.5rem; }
    .modal-image-wrap img {
      max-width: 100%; max-height: 240px; object-fit: contain; border-radius: 12px;
      background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .modal-level {
      font-family: 'Cinzel', serif; font-size: 0.8rem; color: #e67e22;
      letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.4rem; text-align: center;
    }
    .modal h2 { font-family: 'Cinzel', serif; font-size: 1.7rem; color: #f0c14b; margin-bottom: 1rem; text-align: center; }
    .modal p { font-size: 1.05rem; line-height: 1.7; color: #e8d5b5; text-align: center; }

    /* Pétalos que cubren toda la pantalla */
    .petals-container { position: fixed; inset: 0; z-index: 2000; overflow: hidden; display: none; }
    .petals-container.active { display: block; } /* bloquea clics mientras dura */
    .veil {
      position: absolute; inset: 0; opacity: 0;
      background: radial-gradient(circle at 50% 50%, rgba(230,126,34,0.55), rgba(90,25,5,0.85));
      animation: veil 3.6s ease-in-out forwards;
    }
    @keyframes veil { 0% { opacity: 0; } 32% { opacity: 1; } 60% { opacity: 1; } 100% { opacity: 0; } }

    .petal {
      position: absolute; opacity: 0;
      width: var(--sz); height: calc(var(--sz) * 1.25);
      border-radius: 50% 0 50% 50% / 60% 0 60% 60%;
      background: radial-gradient(ellipse at 30% 25%, #ffd36b 0%, var(--c) 55%, #a63d00 100%);
      box-shadow: inset -3px -4px 8px rgba(120, 40, 0, 0.35), 0 2px 6px rgba(0,0,0,0.35);
      animation: sweep 3.4s ease-in-out forwards;
      will-change: transform, opacity;
    }
    @keyframes sweep {
      0%   { opacity: 0; transform: translate(var(--dx), -45vh) rotate(0deg) scale(0.4); }
      30%  { opacity: 1; transform: translate(0, 0) rotate(var(--r1)) scale(1); }
      62%  { opacity: 1; transform: translate(var(--sway), 2vh) rotate(var(--r2)) scale(1.05); }
      100% { opacity: 0.9; transform: translate(var(--sway2), 140vh) rotate(var(--r3)) scale(0.9); }
    }

    footer { text-align: center; padding: 2rem 1rem 3rem; color: #8a6a4a; font-size: 0.85rem; position: relative; z-index: 5; }

    @media (max-width: 600px) { .modal { padding: 1.5rem 1.2rem; } }
    @media (prefers-reduced-motion: reduce) { .altar-item::after, .particle { animation: none; } }
  </style>
</head>
<body>
  <div class="bg-overlay"></div>
  <div id="particles"></div>

  <header>
    <h1>Altar de Muertos</h1>
    <p>Ofrenda interactiva • Haz clic en cada elemento</p>
  </header>

  <main class="altar-container">
    <div class="altar-base" id="altar">
      <img src="altar.jpeg" alt="Altar de Muertos de siete niveles" class="main-altar" />
    </div>
  </main>

  <footer>Que las almas encuentren el camino iluminado por la luz de las velas</footer>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Cerrar">×</button>
      <div class="modal-image-wrap"><img id="modalImg" src="" alt="" /></div>
      <div class="modal-level" id="modalLevel"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalDesc"></p>
    </div>
  </div>

  <div class="petals-container" id="petalsContainer"></div>

  <script>
    /* ---------- Posición de cada nivel sobre la imagen (en % del altar) ----------
       y: altura donde "se apoyan" los elementos (borde frontal del escalón)
       x: [inicio, fin] del ancho disponible en ese nivel
       w: tamaño de los elementos (% del ancho del altar)
       Si algo queda desalineado con tu imagen, ajusta estos números.
       Abre la página con ?debug al final de la URL para ver las líneas guía. */
    const LEVELS = {
      1: { y: 19, x: [35, 65], w: 9 },
      2: { y: 29, x: [30, 70], w: 9.5 },
      3: { y: 40, x: [24, 76], w: 9 },
      4: { y: 52, x: [18, 82], w: 10 },
      5: { y: 64, x: [13, 87], w: 10 },
      6: { y: 76, x: [9, 91], w: 11 },
      7: { y: 92, x: [5, 95], w: 12 }
    };

    const elements = [
      { lvl: 1, name: "Crucifijo", img: "crucifijo.jpg", level: "Primer nivel — El cielo y la fe",
        desc: "Simboliza la fe cristiana y la esperanza en la vida después de la muerte. Representa la protección espiritual y el vínculo con lo divino." },
      { lvl: 1, name: "Arco de flores", img: "arco.jpg", level: "Primer nivel — El cielo y la fe",
        desc: "Representa simbólicamente la entrada al mundo de los difuntos. Generalmente se coloca en la parte superior del altar como portal entre ambos mundos." },
      { lvl: 2, name: "Fotografía", img: "selena.png", level: "Segundo nivel — Las ánimas",
        desc: "Identifica a quién está dedicada la ofrenda y permite recordar su vida. Es el elemento más personal y el corazón del altar." },
      { lvl: 3, name: "Sal", img: "sal.jpg", level: "Tercer nivel — La purificación",
        desc: "Simboliza la purificación y, según la tradición, ayuda a proteger el alma durante su recorrido entre los mundos." },
      { lvl: 3, name: "Agua", img: "agua.jpg", level: "Tercer nivel — La purificación",
        desc: "Representa la vida y se ofrece para calmar la sed de las almas después de su largo viaje desde el más allá." },
      { lvl: 3, name: "Copal", img: "copal.jpg", level: "Tercer nivel — La purificación",
        desc: "Su humo aromático se utiliza desde tiempos prehispánicos para purificar el ambiente y recibir dignamente a los difuntos." },
      { lvl: 3, name: "Incienso", img: "incienso.jpg", level: "Tercer nivel — La purificación",
        desc: "Complementa al copal. Su fragancia eleva las oraciones y limpia el espacio de malas energías para la llegada de las almas." },
      { lvl: 4, name: "Pan de muerto", img: "pan.jpg", level: "Cuarto nivel — El alimento tradicional",
        desc: "Alimento tradicional que simboliza la fraternidad y el recuerdo de los difuntos. Su forma evoca los huesos y el ciclo de la vida." },
      { lvl: 4, name: "Calavera", img: "calavera.jpeg", level: "Cuarto nivel — El alimento tradicional",
        desc: "Representa la muerte como parte natural de la vida. Las calaveritas de azúcar o chocolate son características de esta celebración." },
      { lvl: 4, name: "Dulces", img: "dulces.jpg", level: "Cuarto nivel — El alimento tradicional",
        desc: "Se ofrecen como muestra de cariño y hospitalidad hacia las almas. Endulzan el regreso de quienes ya partieron." },
      /* Nivel 5 (comida y bebidas) queda libre: agrega aquí tamales, mole, atole, etc. con lvl: 5 */
      { lvl: 6, name: "Frutas", img: "frutas.jpg", level: "Sexto nivel — La naturaleza y los aromas",
        desc: "Representan la generosidad de la naturaleza y se ofrecen como alimento fresco. Colores, aromas y sabores de la temporada." },
      { lvl: 6, name: "Flor de cempasúchil", img: "flor.jpg", level: "Sexto nivel — La naturaleza y los aromas",
        desc: "Su color naranja intenso y su aroma se relacionan con la guía de las almas hacia la ofrenda. Es la flor sagrada del Día de Muertos." },
      { lvl: 7, name: "Veladora", img: "vela.gif", level: "Séptimo nivel — La tierra y el descanso",
        desc: "Representa la luz y la esperanza. Según la tradición, su llama ayuda a guiar a las almas en su camino de regreso al hogar." }
    ];

    /* ---------- Colocar cada elemento en su nivel ---------- */
    const altar = document.getElementById('altar');
    Object.keys(LEVELS).forEach(n => {
      const items = elements.filter(e => e.lvl == n);
      const { y, x, w } = LEVELS[n];
      const step = (x[1] - x[0]) / Math.max(items.length, 1);
      items.forEach((el, i) => {
        const b = document.createElement('button');
        b.className = 'altar-item';
        b.style.left = (x[0] + step * (i + 0.5)) + '%';
        b.style.top = y + '%';
        b.style.width = w + '%';
        b.setAttribute('aria-label', el.name);
        b.innerHTML = `<img src="${el.img}" alt="" /><span class="tip">${el.name}</span>`;
        b.addEventListener('click', () => openModal(el));
        altar.appendChild(b);
      });
    });

    if (location.search.includes('debug')) {
      Object.entries(LEVELS).forEach(([n, l]) => {
        const d = document.createElement('div');
        d.className = 'debug-line'; d.style.top = l.y + '%'; d.textContent = 'Nivel ' + n;
        altar.appendChild(d);
      });
    }

    /* ---------- Partículas de fondo ---------- */
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.top = Math.random() * 100 + 'vh';
      p.style.animationDelay = Math.random() * 10 + 's';
      p.style.animationDuration = (8 + Math.random() * 10) + 's';
      particlesContainer.appendChild(p);
    }

    /* ---------- Modal ---------- */
    const overlay = document.getElementById('modalOverlay');
    const modalImg = document.getElementById('modalImg');
    const modalLevel = document.getElementById('modalLevel');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    let busy = false;

    function openModal(el) {
      if (busy) return;
      petalStorm(() => {
        modalImg.src = el.img;
        modalImg.alt = el.name;
        modalLevel.textContent = el.level;
        modalTitle.textContent = el.name;
        modalDesc.textContent = el.desc;
        overlay.classList.add('active');
      });
    }

    function closeModal() {
      if (busy || !overlay.classList.contains('active')) return;
      petalStorm(() => overlay.classList.remove('active'));
    }

    document.getElementById('modalClose').addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    /* ---------- Lluvia de pétalos que cubre toda la pantalla ----------
       Los pétalos aparecen por toda la pantalla (~1.3 s), el contenido cambia
       cuando todo está cubierto y luego los pétalos caen y se despejan. */
    const colors = ['#f39c12', '#e67e22', '#ff9f1c', '#d35400', '#f5b041'];
    const rand = (a, b) => a + Math.random() * (b - a);

    function petalStorm(onCovered) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { onCovered(); return; }
      busy = true;
      const box = document.getElementById('petalsContainer');
      const vw = innerWidth, vh = innerHeight;
      const base = Math.min(Math.max(Math.min(vw, vh) * 0.15, 40), 100);
      const count = Math.min(320, Math.ceil(1.8 * vw * vh / (base * base * 0.7)));

      box.innerHTML = '<div class="veil"></div>';
      box.classList.add('active');

      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        const sz = base * rand(0.6, 1.4);
        p.className = 'petal';
        p.style.cssText =
          `left:${rand(-3, 100)}vw;top:${rand(-3, 100)}vh;--sz:${sz}px;--c:${colors[i % colors.length]};` +
          `--dx:${rand(-15, 15)}vw;--r1:${rand(-200, 200)}deg;--r2:${rand(-300, 300)}deg;--r3:${rand(-720, 720)}deg;` +
          `--sway:${rand(-6, 6)}vw;--sway2:${rand(-20, 20)}vw;animation-delay:${rand(0, 0.7)}s;`;
        box.appendChild(p);
      }

      setTimeout(onCovered, 1500);
      setTimeout(() => { box.classList.remove('active'); box.innerHTML = ''; busy = false; }, 4300);
    }
  </script>
</body>
</html>
