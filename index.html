<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Altar de Muertos Interactivo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0608;
      color: #f5e6c8;
      font-family: 'Playfair Display', serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Fondo atmosférico */
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse at 50% 20%, rgba(120, 40, 20, 0.25) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(80, 20, 60, 0.2) 0%, transparent 50%),
        linear-gradient(180deg, #0a0608 0%, #1a0c12 40%, #0f080a 100%);
      z-index: 0;
      pointer-events: none;
    }

    /* Partículas de fondo suaves */
    .particle {
      position: fixed;
      width: 3px;
      height: 3px;
      background: #e67e22;
      border-radius: 50%;
      opacity: 0.3;
      pointer-events: none;
      z-index: 1;
      animation: float 12s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0.2; }
      50% { transform: translateY(-40px) translateX(15px); opacity: 0.5; }
    }

    header {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2.5rem 1rem 1.5rem;
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: 4px;
      color: #f0c14b;
      text-shadow: 0 0 20px rgba(240, 193, 75, 0.4), 0 2px 4px rgba(0,0,0,0.8);
      margin-bottom: 0.4rem;
    }

    header p {
      font-size: 1rem;
      color: #d4a574;
      font-style: italic;
      opacity: 0.9;
    }

    /* Contenedor principal del altar */
    .altar-container {
      position: relative;
      z-index: 5;
      max-width: 1100px;
      margin: 0 auto 4rem;
      padding: 0 1rem;
    }

    .altar-base {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 
        0 0 60px rgba(230, 126, 34, 0.15),
        0 20px 40px rgba(0,0,0,0.6);
    }

    .altar-base img.main-altar {
      width: 100%;
      display: block;
      border-radius: 12px;
    }

    /* Elementos clickeables flotantes */
    .elements-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1.2rem;
      margin-top: 2.5rem;
      padding: 0 0.5rem;
    }

    .element-card {
      background: rgba(30, 15, 20, 0.75);
      border: 1px solid rgba(240, 193, 75, 0.25);
      border-radius: 14px;
      padding: 1rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.35s ease;
      backdrop-filter: blur(6px);
      position: relative;
      overflow: hidden;
    }

    .element-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(230, 126, 34, 0.1), transparent);
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .element-card:hover {
      transform: translateY(-8px) scale(1.03);
      border-color: rgba(240, 193, 75, 0.6);
      box-shadow: 0 12px 30px rgba(230, 126, 34, 0.25);
    }

    .element-card:hover::before {
      opacity: 1;
    }

    .element-card img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border-radius: 8px;
      margin-bottom: 0.7rem;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
      transition: transform 0.3s ease;
    }

    .element-card:hover img {
      transform: scale(1.08);
    }

    .element-card h3 {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      color: #f0c14b;
      margin-bottom: 0.25rem;
      letter-spacing: 1px;
    }

    .element-card .level {
      font-size: 0.72rem;
      color: #c9a07a;
      opacity: 0.85;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 2, 4, 0.88);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
      backdrop-filter: blur(8px);
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: linear-gradient(160deg, #1c1014 0%, #120a0d 100%);
      border: 1px solid rgba(240, 193, 75, 0.35);
      border-radius: 18px;
      max-width: 560px;
      width: 92%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
      transform: scale(0.85) translateY(30px);
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 25px 60px rgba(0,0,0,0.7), 0 0 40px rgba(230, 126, 34, 0.12);
    }

    .modal-overlay.active .modal {
      transform: scale(1) translateY(0);
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1.2rem;
      background: transparent;
      border: none;
      color: #f0c14b;
      font-size: 1.8rem;
      cursor: pointer;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.25s ease;
      z-index: 10;
    }

    .modal-close:hover {
      background: rgba(240, 193, 75, 0.15);
      transform: rotate(90deg);
    }

    .modal-image-wrap {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .modal-image-wrap img {
      max-width: 100%;
      max-height: 280px;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .modal-level {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      color: #e67e22;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .modal h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.7rem;
      color: #f0c14b;
      margin-bottom: 1rem;
      text-align: center;
    }

    .modal p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #e8d5b5;
      text-align: center;
    }

    /* Animación de pétalos */
    .petals-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2000;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #e67e22;
      border-radius: 50% 0 50% 50%;
      opacity: 0.85;
      animation: fall linear forwards;
      box-shadow: 0 0 6px rgba(230, 126, 34, 0.6);
    }

    .petal:nth-child(odd) {
      background: #f39c12;
      border-radius: 0 50% 50% 50%;
    }

    .petal:nth-child(3n) {
      background: #d35400;
      width: 11px;
      height: 11px;
    }

    @keyframes fall {
      0% {
        transform: translateY(-10vh) rotate(0deg) scale(1);
        opacity: 0.9;
      }
      100% {
        transform: translateY(110vh) rotate(720deg) scale(0.6);
        opacity: 0;
      }
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 2rem 1rem 3rem;
      color: #8a6a4a;
      font-size: 0.85rem;
      position: relative;
      z-index: 5;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .elements-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.9rem;
      }
      .element-card img {
        width: 70px;
        height: 70px;
      }
      .modal {
        padding: 1.5rem 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-overlay"></div>

  <!-- Partículas de fondo -->
  <div id="particles"></div>

  <header>
    <h1>Altar de Muertos</h1>
    <p>Ofrenda interactiva • Haz clic en cada elemento</p>
  </header>

  <main class="altar-container">
    <div class="altar-base">
      <img src="altar.jpeg" alt="Altar de Muertos" class="main-altar" />
    </div>

    <div class="elements-grid" id="elementsGrid">
      <!-- Se llenan dinámicamente -->
    </div>
  </main>

  <footer>
    Que las almas encuentren el camino iluminado por la luz de las velas
  </footer>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="modalClose" aria-label="Cerrar">×</button>
      <div class="modal-image-wrap">
        <img id="modalImg" src="" alt="" />
      </div>
      <div class="modal-level" id="modalLevel"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalDesc"></p>
    </div>
  </div>

  <!-- Contenedor de pétalos -->
  <div class="petals-container" id="petalsContainer"></div>

  <script>
    const elements = [
      {
        id: "crucifijo",
        name: "Crucifijo",
        img: "crucifijo.jpg",
        level: "Primer nivel — El cielo y la fe",
        desc: "Simboliza la fe cristiana y la esperanza en la vida después de la muerte. Representa la protección espiritual y el vínculo con lo divino."
      },
      {
        id: "arco",
        name: "Arco de flores",
        img: "arco.jpg",
        level: "Primer nivel — El cielo y la fe",
        desc: "Representa simbólicamente la entrada al mundo de los difuntos. Generalmente se coloca en la parte superior del altar como portal entre ambos mundos."
      },
      {
        id: "selena",
        name: "Fotografía",
        img: "selena.png",
        level: "Segundo nivel — Las ánimas",
        desc: "Identifica a quién está dedicada la ofrenda y permite recordar su vida. Es el elemento más personal y el corazón del altar."
      },
      {
        id: "sal",
        name: "Sal",
        img: "sal.jpg",
        level: "Tercer nivel — La purificación",
        desc: "Simboliza la purificación y, según la tradición, ayuda a proteger el alma durante su recorrido entre los mundos."
      },
      {
        id: "agua",
        name: "Agua",
        img: "agua.jpg",
        level: "Tercer nivel — La purificación",
        desc: "Representa la vida y se ofrece para calmar la sed de las almas después de su largo viaje desde el más allá."
      },
      {
        id: "copal",
        name: "Copal",
        img: "copal.jpg",
        level: "Tercer nivel — La purificación",
        desc: "Su humo aromático se utiliza desde tiempos prehispánicos para purificar el ambiente y recibir dignamente a los difuntos."
      },
      {
        id: "incienso",
        name: "Incienso",
        img: "incienso.jpg",
        level: "Tercer nivel — La purificación",
        desc: "Complementa al copal. Su fragancia eleva las oraciones y limpia el espacio de malas energías para la llegada de las almas."
      },
      {
        id: "pan",
        name: "Pan de muerto",
        img: "pan.jpg",
        level: "Cuarto nivel — El alimento tradicional",
        desc: "Alimento tradicional que simboliza la fraternidad y el recuerdo de los difuntos. Su forma evoca los huesos y el ciclo de la vida."
      },
      {
        id: "calavera",
        name: "Calavera",
        img: "calavera.jpeg",
        level: "Cuarto nivel — El alimento tradicional",
        desc: "Representa la muerte como parte natural de la vida. Las calaveritas de azúcar o chocolate son características de esta celebración."
      },
      {
        id: "dulces",
        name: "Dulces",
        img: "dulces.jpg",
        level: "Cuarto nivel — El alimento tradicional",
        desc: "Se ofrecen como muestra de cariño y hospitalidad hacia las almas. Endulzan el regreso de quienes ya partieron."
      },
      {
        id: "frutas",
        name: "Frutas",
        img: "frutas.jpg",
        level: "Quinto nivel — La comida y las bebidas",
        desc: "Representan la generosidad de la naturaleza y se ofrecen como alimento fresco. Colores, aromas y sabores de la temporada."
      },
      {
        id: "flor",
        name: "Flor de cempasúchil",
        img: "flor.jpg",
        level: "Sexto nivel — La naturaleza y los aromas",
        desc: "Su color naranja intenso y su aroma se relacionan con la guía de las almas hacia la ofrenda. Es la flor sagrada del Día de Muertos."
      },
      {
        id: "vela",
        name: "Veladora",
        img: "vela.gif",
        level: "Séptimo nivel — La tierra y el descanso",
        desc: "Representa la luz y la esperanza. Según la tradición, su llama ayuda a guiar a las almas en su camino de regreso al hogar."
      }
    ];

    // Generar tarjetas
    const grid = document.getElementById('elementsGrid');
    elements.forEach(el => {
      const card = document.createElement('div');
      card.className = 'element-card';
      card.innerHTML = `
        <img src="${el.img}" alt="${el.name}" loading="lazy" />
        <h3>${el.name}</h3>
        <div class="level">${el.level.split('—')[0].trim()}</div>
      `;
      card.addEventListener('click', () => openModal(el));
      grid.appendChild(card);
    });

    // Partículas de fondo
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.top = Math.random() * 100 + 'vh';
      p.style.animationDelay = Math.random() * 10 + 's';
      p.style.animationDuration = (8 + Math.random() * 10) + 's';
      particlesContainer.appendChild(p);
    }

    // Modal
    const overlay = document.getElementById('modalOverlay');
    const modalImg = document.getElementById('modalImg');
    const modalLevel = document.getElementById('modalLevel');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const closeBtn = document.getElementById('modalClose');

    function openModal(el) {
      createPetals(() => {
        modalImg.src = el.img;
        modalImg.alt = el.name;
        modalLevel.textContent = el.level;
        modalTitle.textContent = el.name;
        modalDesc.textContent = el.desc;
        overlay.classList.add('active');
      });
    }

    function closeModal() {
      createPetals(() => {
        overlay.classList.remove('active');
      });
    }

    closeBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeModal();
    });

    // Animación de pétalos
    function createPetals(callback) {
      const container = document.getElementById('petalsContainer');
      container.innerHTML = '';

      const count = 55;
      for (let i = 0; i < count; i++) {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.style.left = Math.random() * 100 + 'vw';
        petal.style.animationDuration = (2.2 + Math.random() * 2.5) + 's';
        petal.style.animationDelay = (Math.random() * 0.8) + 's';
        petal.style.transform = `rotate(${Math.random() * 360}deg)`;
        container.appendChild(petal);
      }

      // Ejecutar callback después de que empiecen a caer
      setTimeout(callback, 700);

      // Limpiar pétalos después de la animación
      setTimeout(() => {
        container.innerHTML = '';
      }, 4500);
    }

    // Tecla Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay.classList.contains('active')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
